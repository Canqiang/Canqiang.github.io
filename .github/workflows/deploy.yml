name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Astro and translation checks
        run: npm run check

      - name: Regenerate social images
        run: npm run generate:og

      - name: Build the static site
        run: npm run build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --cache
            --cache-exclude-status 408,429,500..=599
            --root-dir '${{ github.workspace }}/dist'
            --remap 'https://canqiang.github.io/ file://${{ github.workspace }}/dist/'
            'dist/**/*.html'
          fail: false
          failIfEmpty: true
          lycheeVersion: v0.24.2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry transient link-check 503/504 errors
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          report="lychee/out.md"
          if [[ ! -f "$report" ]]; then
            echo "Link check failed with exit code ${{ steps.lychee.outputs.exit_code }} and no report file."
            exit 1
          fi

          only_transient_503_504() {
            local errors
            errors="$(grep -E '^[-*] (\[ \] )?\[' "$1" || true)"
            [[ -n "$errors" ]] && ! grep -qvE '^[-*] (\[ \] )?\[(503|504)\]' <<< "$errors"
          }

          if ! only_transient_503_504 "$report"; then
            echo "Non-transient link errors detected; failing without retry."
            rm -f .lycheecache
            exit 1
          fi

          for attempt in 1 2 3; do
            delay=$((attempt * 5))
            echo "Transient 503/504 detected (lychee v0.24.2 lacks PR #2324 5xx retries). Retrying uncached links in ${delay}s (attempt ${attempt}/3)..."
            sleep "$delay"
            set +e
            lychee \
              --config lychee.toml \
              --cache \
              --cache-exclude-status 408,429,500..=599 \
              --format markdown \
              --output "$report" \
              --root-dir "${GITHUB_WORKSPACE}/dist" \
              --remap "https://canqiang.github.io/ file://${GITHUB_WORKSPACE}/dist/" \
              'dist/**/*.html'
            rc=$?
            set -e
            cat "$report"
            if [[ "$rc" -eq 0 ]]; then
              rm -f .lycheecache
              exit 0
            fi
            if ! only_transient_503_504 "$report"; then
              echo "Non-transient link error detected on retry."
              rm -f .lycheecache
              exit "$rc"
            fi
          done

          rm -f .lycheecache
          echo "Transient 503/504 errors persisted after 3 retries."
          exit 1

      - name: Run Lighthouse CI
        run: npx --no-install lhci autorun

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
